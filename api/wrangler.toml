name = "tort-po-lyubvi-api"
main = "worker.js"
compatibility_date = "2026-08-01"

[vars]
# Домены, с которых принимаются заявки. Чужой сайт слать не сможет.
# Добавьте сюда свой домен, когда он появится, через запятую.
ALLOWED_ORIGINS = "https://strangehul1-design.github.io"

# ─────────────────────────────────────────────────────────────
# Секретов здесь НЕТ и быть не должно — файл лежит в репозитории.
# Все ключи задаются командой `wrangler secret put ИМЯ`:
#
#   TELEGRAM_BOT_TOKEN    токен от @BotFather
#   TELEGRAM_CHAT_ID      куда слать заявки в Telegram
#   VK_TOKEN              ключ доступа сообщества ВК (права: messages)
#   VK_PEER_ID            куда слать в ВК: ваш id или 2000000000+id беседы
#   VK_CONFIRMATION       строка подтверждения из настроек Callback API
#   VK_SECRET             секретный ключ Callback API
#   YOOKASSA_SHOP_ID      появится после регистрации магазина
#   YOOKASSA_SECRET_KEY   там же; пока не задан — работает демо-оплата
#   ADMIN_KEY             ваш пароль для просмотра заявок: /pending?key=...
#   TELEGRAM_WEBHOOK_SECRET  пароль, которым Telegram подписывает события
#                            бота-редактора (придумываете сами)
# ─────────────────────────────────────────────────────────────

# ── Хранилище заявок ──
# Сюда падает каждая заявка ДО отправки в Telegram. Если Telegram не ответил,
# телефон клиента всё равно сохранён, и заявку видно по адресу /pending
#
# Создать одной командой (выполнить в этой папке):
#   wrangler kv namespace create REQUESTS
# Команда напечатает id — впишите его ниже вместо ЗАМЕНИТЕ_НА_ID
[[kv_namespaces]]
binding = "REQUESTS"
id = "847ce293669845f4aa5b37a2c4d0448b"
